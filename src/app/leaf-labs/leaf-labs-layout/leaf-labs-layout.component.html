<app-layout
  [eyebrow]="'app.leaf-labs.layout.eyebrow' | translate"
  [title]="'app.leaf-labs.layout.title' | translate"
  [baseline]="'app.leaf-labs.layout.baseline' | translate">
  <div layoutMain>
    <nav mat-tab-nav-bar [tabPanel]="tabPanel">
      <a
        mat-tab-link
        *ngFor="let link of navLinks"
        [routerLink]="link.link"
        routerLinkActive
        #rla="routerLinkActive"
        [active]="rla.isActive"
        >{{ link.labelKey | translate }}</a>
    </nav>
    <mat-tab-nav-panel #tabPanel class="content">
      <router-outlet></router-outlet>
    </mat-tab-nav-panel>
  </div>
</app-layout>
