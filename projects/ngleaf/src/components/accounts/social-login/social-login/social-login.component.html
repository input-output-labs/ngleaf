<div class="leaf-social-login-container" *ngIf="googleEnabled || appleEnabled">
  <div *ngIf="googleEnabled" [id]="getGoogleButtonId()" class="leaf-social-login-btn google-btn"></div>
  <div *ngIf="appleEnabled"
    id="appleid-signin"
    class="leaf-social-login-btn apple-btn"
    data-color="black"
    data-border="true"
    data-type="sign-in"
    data-mode="logo-only">
  </div>
</div>
